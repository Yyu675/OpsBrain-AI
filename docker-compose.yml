# =============================================================================
# OpsBrain AI 生产编排（一键部署）
#
#   cp .env.example .env   # 填 ALIBABA_API_KEY、ALERT_WEBHOOK_SECRET 等
#   docker compose up -d --build
#   访问 http://localhost:8088/ai
#
# 与 docker-compose.dev.yml 的区别：
#   dev  —— 只起中间件，应用在 IDEA 里跑，端口对外映射（25432/26379）便于本机连
#   prod —— 应用一起容器化，中间件端口**不对外暴露**，仅在内网互通
# =============================================================================

# S5-2(批 37)运行件预算：日志有界(50m×5≈250MB/容器,防日志吃满磁盘)
# 与资源上限——容器级预算和告警规则(monitoring/alert.rules.yml)互为表里,
# 没预算哪来的「超预算告警」。
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: opsbrain-ai:latest
    container_name: opsbrain-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8088}:8088"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai

      # 中间件走服务名，不是 localhost —— 容器内 localhost 指向容器自身
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/devops_knowledge_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-devops}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-devops_password}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-devops_redis_pwd}

      # AI：默认 MOCK，配了 key 再切 REAL，避免误部署就开始烧钱
      AI_MODE: ${AI_MODE:-MOCK}
      ALIBABA_API_KEY: ${ALIBABA_API_KEY:-}

      # 安全：这几项生产必须显式设置，默认值只适用于本地
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      ALERT_WEBHOOK_SECRET: ${ALERT_WEBHOOK_SECRET:-}
      # 落库加密主密钥（批89 P0）：漏透传 = 容器读不到 .env 该值 = API Key 明文落库。
      # 生成 openssl rand -hex 32；轮换顺序见 09-operations/上线放行Runbook §2（顺序反了 REAL 拒启）
      MODEL_KEY_CRYPT_SECRET: ${MODEL_KEY_CRYPT_SECRET:-}

      # 对象存储
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}

      # 指标抓取面令牌（2026-10-15）：与 Prometheus 的 credentials_file 指向同一份文件。
      # 没有它 Prometheus 抓 /ai/actuator/prometheus 恒 401 → OpsBrainDown 常亮误报
      # + 6 条应用规则恒哑（应用侧行为见 infrastructure/guard/ScrapeTokenGuard）。
      SCRAPE_TOKEN_FILE: /run/secrets/scrape_token
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      # 令牌先于应用就位（只读挂载，文件缺失时应用按"未配置"处理 → fail-closed 401）
      scrape-token-init:
        condition: service_completed_successfully
    volumes:
      - ./monitoring/secrets/scrape_token:/run/secrets/scrape_token:ro
    networks: [opsbrain]
    logging: *default-logging
    # 批 76 / P2-4（报告 174 审计件）：app 此前是全栈唯一无 healthcheck 的服务——
    # 应用假死（JVM 活着但请求全超时）不可发现，unless-stopped 只管进程死。
    # 探针用 /ai/actuator/health（免鉴权白名单端点），验证到 db 层连通。
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8088/ai/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    # 预算口径:JVM 走 MaxRAMPercentage=75(Dockerfile),2g 容器约 1.5g 堆
    # ——超 limit 的语义是 OOMKill+编排重启,不是降速;调预算先看 Grafana 基线
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.5"
        reservations:
          memory: 768m

  postgres:
    # 不要换回 ankane/pgvector:v0.5.1：其 2022 年代 tarball 在本机 containerd-snapshotter
    # 解包路径下 47% 普通文件变空字节（exec format error，双镜像源复现），官方继任镜像实测正常。
    image: pgvector/pgvector:pg16
    container_name: opsbrain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: devops_knowledge_db
      POSTGRES_USER: ${POSTGRES_USER:-devops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devops_password}
      TZ: Asia/Shanghai
    volumes:
      - pg_data:/var/lib/postgresql/data
      # 首次启动自动建表（仅在数据目录为空时运行，已有数据的卷不会被重复初始化）。
      #
      # S0-1 起 schema 由 Flyway 托管；这里仅对空卷预建 V1 基线。
      # 只挂一个显式脚本 + 基线文件本身，不挂迁移目录或 sql/ 目录：
      # sql/ 里有 mock_data.sql，整目录挂载会把演示数据灌进生产库。
      - ./scripts/docker-initdb.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - ./src/main/resources/db/migration/V1__baseline.sql:/opt/opsbrain-sql/V1__baseline.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devops} -d devops_knowledge_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [opsbrain]
    logging: *default-logging
    # 批 76 / P2-4：中间件预算补齐（此前全栈只有 app 有 limits——PG OOM 无预算
    # 且监控规则无「超预算」基线可告）。1g 对 pgvector 检索负载够用（本库
    # 规模实测共享缓冲命中率高）；shared_buffers 等再调预算时先看基线再动。
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
        reservations:
          memory: 384m
    # 生产不对外暴露端口，只走内网。需要连库时用
    #   docker compose exec postgres psql -U devops -d devops_knowledge_db

  redis:
    image: redis:7.0-alpine
    container_name: opsbrain-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-devops_redis_pwd}
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data
    healthcheck:
      # 带密码时 PING 必须先认证，否则健康检查恒失败
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-devops_redis_pwd} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [opsbrain]
    logging: *default-logging
    # 批 76 / P2-4：Redis 预算——AOF+缓存工作集实测远小于 512m；
    # maxmemory 不在 command 里设（缓存键无 TTL 者会被驱逐出正确性问题），
    # 容器 limit 即硬顶（OOM 前会看到内存告警）。
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
        reservations:
          memory: 128m

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    container_name: opsbrain-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # 集群指标端点免 JWT（2026-10-15）：MinIO 默认要求 Prometheus 带 JWT 才能读
      # /minio/v2/metrics/cluster——不带就 403，而规则 OpsBrainMinioDown 查的
      # minio_cluster_health_online 永远没有数据（不误报，也永不响）。
      # public 的含义是"指标端点匿名可读"，指标不含对象内容与凭据；
      # 端口本身只在 compose 内网暴露（生产不映射到宿主）。
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [opsbrain]
    logging: *default-logging
    # 批 76 / P2-4：MinIO 预算——附件/归档桶元数据 + JVM 嵌入式进程 1g 足够
    # （本仓附件上限 20MB×低频上传）；对象数据在卷里不占容器内存。
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
        reservations:
          memory: 256m

  # ------------------- L2 监控栈（批 75 / P1-6，报告 174 审计）-------------------
  # 修复前监控栈只在 dev compose——生产一键部署后 OpsBrainDown 等告警规则
  # 无数据源，L2 告警链路静默断链（README 声称的 L2 能力实际不可用）。
  # 三件套与 app 同网络（opsbrain）：Prometheus 抓 app:8088/ai/actuator/prometheus，
  # node-exporter 采集宿主机，Alertmanager 路由告警回 OpsBrain webhook。
  # 注意：dev 形态后端在宿主机跑故 alertmanager.yml 用 host.docker.internal，
  # prod 形态后端在网内——monitoring/alertmanager.yml 的 webhook 地址需按部署形态确认。

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: opsbrain-node-exporter
    restart: unless-stopped
    command:
      # 生产 Linux 直挂宿主根（rslave）；WSL2 不支持 rslave 的说明见 dev compose
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro,rslave
    ports:
      - "9100:9100"
    networks: [opsbrain]
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: opsbrain-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      # 抓取凭据（与 app 的 SCRAPE_TOKEN_FILE 同一份文件，见 monitoring/prometheus.yml 注释）
      - ./monitoring/secrets/scrape_token:/etc/prometheus/secrets/scrape_token:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/-/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - node-exporter
      - alertmanager
      - scrape-token-init
      - postgres-exporter
      - redis-exporter
    networks: [opsbrain]
    logging: *default-logging

  # ------------------- 抓取令牌（一次性 init，幂等）-------------------
  # 为什么用容器生成而不是"提交一个令牌文件"：令牌是秘密，不能进 Git。
  # 语义：文件不存在则生成 32 字节随机十六进制；已存在则原样保留（不轮换、不覆盖）。
  # 轮换 = 删文件后 `docker compose up -d scrape-token-init`（应用侧每次请求重读文件，
  # 不需要重启；Prometheus 侧下个抓取周期即生效）。
  scrape-token-init:
    image: busybox:1.36
    container_name: opsbrain-scrape-token-init
    command:
      - sh
      - -c
      - |
        set -e
        f=/secrets/scrape_token
        if [ ! -s "$$f" ]; then
          head -c 32 /dev/urandom | od -An -tx1 | tr -d ' 
' > "$$f"
          echo "[scrape-token] 已生成新令牌（32 字节十六进制）"
        else
          echo "[scrape-token] 令牌已存在，保留不覆盖"
        fi
        chmod 644 "$$f"
    volumes:
      - ./monitoring/secrets:/secrets
    networks: [opsbrain]
    logging: *default-logging

  # ------------------- 中间件 exporter（2026-10-15 补接线）-------------------
  # 供给 opsbrain-dependency-alerts 三条规则：没有它们，PG/Redis 宕机规则永不触发。
  # 探活口径：pg_up / redis_up（1=在，0=不响应）——与应用自身 /actuator/health 的
  # db/redis 组件互为交叉验证（一边是网络视角，一边是应用视角）。
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.19.1
    container_name: opsbrain-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-devops}:${POSTGRES_PASSWORD:-devops_password}@postgres:5432/devops_knowledge_db?sslmode=disable
      # 只开探活与关键库指标：默认会把 pg_stat_* 全量抓一遍，对 2g 预算的机器是白噪声
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "false"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [opsbrain]
    logging: *default-logging

  redis-exporter:
    image: oliver006/redis_exporter:v1.91.1
    container_name: opsbrain-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-devops_redis_pwd}
    depends_on:
      redis:
        condition: service_healthy
    networks: [opsbrain]
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: opsbrain-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9093/-/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [opsbrain]
    logging: *default-logging

volumes:
  pg_data:
  redis_data:
  minio_data:
  prometheus_data:

networks:
  opsbrain:
    driver: bridge

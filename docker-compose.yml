# =============================================================================
# OpsBrain AI 生产编排（一键部署）
#
#   cp .env.example .env   # 填 ALIBABA_API_KEY、ALERT_WEBHOOK_SECRET 等
#   docker compose up -d --build
#   访问 http://localhost:8088/ai
#
# 与 docker-compose.dev.yml 的区别：
#   dev  —— 只起中间件，应用在 IDEA 里跑，端口对外映射（25432/26379）便于本机连
#   prod —— 应用一起容器化，中间件端口**不对外暴露**，仅在内网互通
# =============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: opsbrain-ai:latest
    container_name: opsbrain-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8088}:8088"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai

      # 中间件走服务名，不是 localhost —— 容器内 localhost 指向容器自身
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/devops_knowledge_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-devops}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-devops_password}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-devops_redis_pwd}

      # AI：默认 MOCK，配了 key 再切 REAL，避免误部署就开始烧钱
      AI_MODE: ${AI_MODE:-MOCK}
      ALIBABA_API_KEY: ${ALIBABA_API_KEY:-}

      # 安全：这两项生产必须显式设置，默认值只适用于本地
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      ALERT_WEBHOOK_SECRET: ${ALERT_WEBHOOK_SECRET:-}

      # 对象存储
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [opsbrain]

  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: opsbrain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: devops_knowledge_db
      POSTGRES_USER: ${POSTGRES_USER:-devops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devops_password}
      TZ: Asia/Shanghai
    volumes:
      - pg_data:/var/lib/postgresql/data
      # 首次启动自动建表（仅在数据目录为空时运行，已有数据的卷不会被重复初始化）。
      #
      # 只挂一个显式脚本，不挂整个 sql/ 目录：
      #   - sql/ 里有 mock_data.sql，整目录挂载会把演示数据灌进生产库；
      #   - initdb 按文件名字母序执行，init.sql 排在 migration_* 之前
      #     只是 'i'<'m' 的巧合，不是保证。顺序必须显式写死。
      - ./scripts/docker-initdb.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - ./sql:/opt/opsbrain-sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devops} -d devops_knowledge_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [opsbrain]
    # 生产不对外暴露端口，只走内网。需要连库时用
    #   docker compose exec postgres psql -U devops -d devops_knowledge_db

  redis:
    image: redis:7.0-alpine
    container_name: opsbrain-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-devops_redis_pwd}
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data
    healthcheck:
      # 带密码时 PING 必须先认证，否则健康检查恒失败
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-devops_redis_pwd} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [opsbrain]

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    container_name: opsbrain-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [opsbrain]

volumes:
  pg_data:
  redis_data:
  minio_data:

networks:
  opsbrain:
    driver: bridge

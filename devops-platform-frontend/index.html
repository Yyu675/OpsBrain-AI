<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>OpsBrain AI · 智维大脑</title>
    <!--
      首屏防闪烁：必须在任何渲染之前**同步**执行。
      否则页面先以浅色画一帧，Vue 启动后才切暗色，
      用户会看到一次刺眼的白闪——暗色主题最典型的体验瑕疵。
      内容与 src/composables/useTheme.ts 的 THEME_INIT_SCRIPT 保持一致。
    -->
    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('opsbrain-theme') || '{}')
          var m = s.mode || 'system'
          var d =
            m === 'dark' ||
            (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          var h = document.documentElement
          if (d) h.classList.add('dark')
          h.dataset.theme = s.preset || 'default'
          h.dataset.radius = s.radius || 'md'
          h.dataset.density = s.density || 'compact'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

# =============================================================================
# 生产环境配置（SPRING_PROFILES_ACTIVE=prod 时叠加在 application.yml 之上）
#
# 本文件此前是 0 字节。空文件与"没有这个文件"在运行行为上等价，
# 但在阅读上不等价：它让人以为"生产已经确认过、无需特殊配置"，
# 于是没人再去核对那些**默认值只适合本地**的项。
#
# 只写「生产必须与默认值不同」的项，其余沿用 application.yml。
# 每一项都对应代码中真实读取的配置键，不写无人读取的装饰性配置。
# 敏感值一律走环境变量，不写进本文件（本文件会进版本库）。
# =============================================================================

devops:
  schema:
    # 生产必须开：表结构不完整时直接拒绝启动（默认 false，见 SchemaGuard）。
    # 默认关是为了让开发环境能带着半旧的库调试；但在生产，
    # "启动成功但缺列"意味着知识检索一查就报错，而故障要等用户
    # 点了检索才暴露——那时排查方向多半会跑到向量库或模型上。
    fail-fast: ${SCHEMA_FAIL_FAST:true}

  security:
    # 生产恒开鉴权，且不给环境变量留关闭的口子。
    # AUTH_ENABLED=false 只对本地 UI 预览有意义：关掉它会让所有
    # /api/** 免鉴权，且因 Sa-Token 无会话导致 @SaCheckRole 一并失效
    # ——这个组合曾经真实发生过（当时是为了预览临时注释掉拦截器）。
    auth-enabled: true

  auth:
    seed:
      # 生产强制要求显式提供种子密码，不接受内置默认值。
      #
      # 默认配置是 seed.enabled=true + password=admin123：生产部署若没设
      # AUTH_SEED_PASSWORD，启动时会自动建出用户名 admin / 密码 admin123 的
      # 管理员账号——这是一个在源码里公开可查的弱口令，而它拥有全部权限。
      #
      # 这里不写死 enabled=false：那样全新部署会因为没有任何用户而完全
      # 登录不进去，运维只能手工插库。折中是保留建号能力，但密码必须由
      # 环境变量提供；未提供时下面的占位串会被 BCrypt 编码成一个无人知晓的
      # 哈希，等效于「账号存在但登不进」，再由运维走改密流程。
      # 失败方向朝「登不进」而不是「谁都能进」。
      enabled: ${AUTH_SEED_ENABLED:true}
      username: ${AUTH_SEED_USERNAME:admin}
      password: ${AUTH_SEED_PASSWORD:__MUST_SET_AUTH_SEED_PASSWORD__}

  ai:
    # 刻意不写死 REAL：误部署就开始烧 API 额度。
    # 由部署方通过环境变量显式打开（docker-compose.yml 默认给 MOCK）。
    mode: ${AI_MODE:MOCK}

spring:
  datasource:
    hikari:
      # ==================== S5-4.4 池核查落器（批 43 / 报告 146）====================
      # 现状勘定：此前 prod 走 Boot 默认（pool=10 / timeout=30s），
      # dev 方言为 10/2/30s——默认值只能本地成立，生产不核等于裸奔。
      #
      # 规模公式（单一铁律）：replicas × maximum-pool-size ≤
      # PG max_connections × 0.7（compose PG 未覆写，默认 100）。
      # 现默认 20 —— web 并发大头已被 llm ratelimiter(60/s）与
      # webhook 滑窗闸（SlidingWindowRateLimiter）压底，DB 争用远低于 web 线程数。
      # 要扩副本先扩公式；公式不破，池不炸。
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      # 20s 而非默认 30s：连接拿不到多半是池耗尽或 PG 卡住，
      # 多等 10s 不会等来连接，只会把 Tomcat 线程多押 10s。
      connection-timeout: ${DB_POOL_CONN_TIMEOUT_MS:20000}
      # max-lifetime 必须显著小于 PG idle_in_transaction_session_timeout
      # 与链路设备的空闲断连（负载均衡典型 10~30 分钟）——
      # 连接比自己先死的池，全池烂尾是常态。600s 给小武器，不赌长跑。
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:600000}
      # 闲置 5 分钟回收；keepalive 必须 < idle-timeout，
      # 读到已死但尚未过期连接（测个 SELECT 1 再发）是西墙漏水东墙补，
      # 心跳放在恰间歇即廉价。
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:300000}
      keepalive-time: ${DB_POOL_KEEPALIVE_MS:240000}
      # leak-detection-threshold 不进 prod：阈值期打印栈是调查期武器，
      # 常年挂着等于把每个长事务都当嫌疑犯记录——
      # 池耗尽三连（active 贴 max/connection.wait 高/慢查询）
      # 本册方法论卷 §5 已给排查定式。

# ============================================================
# API 文档：生产环境整体关闭
# ============================================================
# 为什么必须关：Sa-Token 拦截器只管 /api/**，springdoc 的
# /v3/api-docs 与 /swagger-ui/** 不在其下，线上开着等于**无鉴权暴露
# 全部 130 个端点的结构、参数与示例**——对攻击者是一份现成的攻击面地图。
#
# 用 enabled=false 整体关闭，而不是「留着端点再加鉴权」：
# 后者多一个可能配错的环节，而生产环境本就不需要在线看文档
# （契约应在 CI 里导出成静态产物供前端消费）。
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    com.devops.agent: INFO
    # DEBUG 下会把请求/响应体打进日志。模型响应里可能带用户输入的
    # 敏感信息，进了日志归档系统就收不回来了。
    dev.langchain4j: WARN

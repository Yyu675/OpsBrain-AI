spring:
  application:
    name: devops-platform-backend

  profiles:
    active: ${spring_profiles_active:dev}

  # ==================== 异步请求超时（A2 修复）====================
  # SSE（SseEmitter）走 Spring MVC 异步请求通道，受此值约束。
  # 超时层级必须满足：MVC async > SSE emitter > 模型总超时，
  # 否则内层还在正常工作，外层已经把连接掐断。
  # 此前未配置，默认值随容器而定（Tomcat 常见 30s 或不限），
  # 与 SSE 的 60s、reasoner 模型的 120s 三者互不协调。
  mvc:
    async:
      request-timeout: ${MVC_ASYNC_TIMEOUT_MS:180000}

  # 数据源配置（由 profile 具体化）
  datasource:
    driver-class-name: org.postgresql.Driver

  # Redis 配置（由 profile 具体化）
  data:
    redis:
      database: 0

server:
  port: 8088
  servlet:
    context-path: /ai

# ==================== 日志（A5：全链路 traceId）====================
# %X{traceId} 从 MDC 读取，由 TraceIdFilter 在请求入口写入。
# 没有它，日志里就无法把一次请求的所有行串起来——这是排障效率的地基。
# 未经 Filter 的线程（定时任务/异步回调）若未用 TraceContext.wrap 搬运 MDC，
# 此处会打印为空，属预期行为，可据此发现遗漏的跨线程传递点。
logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] [%X{traceId:-}] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId:-}] %-5level %logger{36} - %msg%n"

spring.servlet.multipart:
  # 单文件与单请求上限。与 devops.storage.attachment.max-file-size 保持一致，
  # 二者不一致时以更小者生效：Tomcat 会在进入业务代码前直接拒绝。
  max-file-size: 20MB
  max-request-size: 20MB

# ==================== Sa-Token 鉴权（方向三）====================
sa-token:
  # token 名称（前端请求头/参数名；登录接口会返回 tokenName 供前端使用）
  token-name: satoken
  # token 有效期（秒），默认 1 天。-1 为永不过期
  timeout: 86400
  # 最低活跃频率（秒），-1 不检查（用户长时间不操作也不强制失效）
  active-timeout: -1
  # 允许同一账号多端同时登录（true）；false 则新登录挤掉旧登录
  is-concurrent: true
  # 多人登录共用一个 token（false=每次登录生成新 token，更安全）
  is-share: false
  # token 风格：uuid
  token-style: uuid
  # 从请求头读 token（前后端分离主用）
  is-read-header: true
  # 从 query 参数读 token（SSE：EventSource 不支持自定义头，靠 ?satoken=xxx）
  is-read-body: true
  # 不从 Cookie 读（前后端分离，避免 CSRF；也不写 Cookie）
  is-read-cookie: false
  # 关闭 Sa-Token 启动 banner 日志
  is-log: false

# ==================== OpsBrain AI 自定义配置 ====================
devops:
  # ==================== Schema 自检 ====================
  schema:
    # 启动后校验关键列/表是否存在（迁移是否漏执行）。
    # 本项目迁移靠人工按序执行、无版本表，"部署了新 JAR 但漏跑迁移"
    # 是很难查的故障：缺 visibility 列会让知识检索整体报错，
    # 而错误表象是「知识库暂不可用」，排查方向容易跑偏。
    #
    # 默认只告警不阻断（开发环境常只跑了部分迁移）。
    # 生产建议置 true，让漏迁移在部署时立即暴露。
    fail-fast: ${SCHEMA_FAIL_FAST:false}

  # ==================== 审计（C5）====================
  audit:
    # 通用写操作审计总开关。仅拦 POST/PUT/PATCH/DELETE，
    # 读操作量级高一到两个数量级且无审计价值，一律跳过。
    # 关闭仅用于极端性能排查——L3/L4 阶段 AI 自动执行动作时，
    # 审计是合规底线，不是可选项。
    enabled: ${AUDIT_ENABLED:true}

  # ==================== 安全（A6/D3）====================
  security:
    cors:
      # 允许跨域的来源，逗号分隔。默认 * 仅供本地开发。
      # ⚠️ 生产必须显式列举，例如：
      #   CORS_ALLOWED_ORIGINS=https://ops.example.com,https://admin.example.com
      # 因为本项目 allowCredentials=true，* 等价于「任意站点可携带用户凭证调用本站 API」。
      allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

  ai:
    # 双模开关：MOCK（开发期不调 API）/ REAL（生产模式）
    mode: ${AI_MODE:MOCK}

    # 阿里云百炼配置（Real 模式生效）
    alibaba:
      api-key: ${ALIBABA_API_KEY:your-alibaba-api-key-here}
      base-url: ${ALIBABA_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      # 主力模型（日常对话，快速响应）
      turbo-model: ${ALIBABA_TURBO_MODEL:qwen-plus}
      # 推理模型（复杂问题，可选）
      reasoner-model: ${ALIBABA_REASONER_MODEL:qwen-max}
      # Embedding 模型（1536 维）
      embedding-model: ${ALIBABA_EMBEDDING_MODEL:text-embedding-v2}
      # 超时配置（毫秒）
      timeout: 60000
      max-retries: 2

    # 向量维度铁律（全链路统一）
    vector:
      dimension: 1536

    # 语义缓存配置
    semantic-cache:
      enabled: true
      # 相似度阈值（>= 此值命中缓存）
      similarity-threshold: 0.85
      # 缓存 TTL（秒）
      ttl: 3600
      # 热查询缓存上限，超出后按 LRU 淘汰
      max-hot-queries: 100

    # 幻觉防护 L4 相似度熔断
    hallucination:
      min-similarity-score: 0.73

    # ==================== SSE 流式推送（A2 修复）====================
    # 超时层级铁律（不得倒挂）：
    #   spring.mvc.async.request-timeout (180s)
    #     > devops.ai.sse.timeout-ms      (150s)
    #       > reasoner 模型总超时          (120s = alibaba.timeout * 2)
    #         > turbo 模型超时             (60s  = alibaba.timeout)
    #
    # 此前 SseEmitter 硬编码 60s，而 reasoner 模型允许跑 120s，
    # 导致「复杂堆栈分析」这一核心场景必然在 60s 被前端判超时，
    # 而后端模型仍在计费运行。改配置项后三层对齐。
    # ==================== 对话限流（C4）====================
    # /chat/stream 是全项目最贵的端点：一次请求 = 一次真实 LLM 调用，
    # 耗时数十秒、按 token 计费、占用一个异步线程直到结束。
    # 无限流时一段循环脚本即可打爆额度、连接池与 Tomcat 异步容量。
    #
    # 20 次/分钟：正常人工提问远低于此（一次对话通常要读几十秒回答），
    # 而脚本刷接口会立刻触顶。限流按 userId 而非 IP——
    # 企业内网同一出口 NAT 后按 IP 会让一人刷爆全组。
    chat:
      rate-limit: ${CHAT_RATE_LIMIT:20}
      rate-window-ms: 60000

    sse:
      # SSE 连接总超时（毫秒）。必须 > 最慢模型的总超时（reasoner 120s）。
      timeout-ms: ${SSE_TIMEOUT_MS:150000}
      # 心跳间隔（毫秒）。长时间无数据时，Nginx/网关等中间代理可能
      # 按空闲超时主动断连（常见默认 60s）。定期发送 SSE 注释帧
      # （": heartbeat"）保活，该帧不触发前端 onmessage，无副作用。
      heartbeat-interval-ms: ${SSE_HEARTBEAT_MS:15000}

    # 文档索引配置（DocumentIndexer 读取）
    index:
      # 超时时间（毫秒），向量化 + 切片写入超时降级
      timeout-ms: 60000
      # 批量切片数，单次 JDBC batch 写入量
      batch-size: 20

    # 检索策略
    retrieval:
      # 混合检索（向量 + 关键词加权融合）。
      # 默认关闭：content_tsv 需触发器维护，且中文分词依赖 PG 扩展
      # （zhparser/pg_jieba）。未装扩展时 to_tsvector('simple', 中文)
      # 几乎无效，启用会让关键词权重变成噪音。
      hybrid-enabled: false
      vector-weight: 0.65
      keyword-weight: 0.35

    # 知识库生命周期治理（P1-9）
    knowledge:
      # 孤儿切片定时清理开关。孤儿切片由已停用的 /ingest 端点产生（doc_id IS NULL），
      # 逃脱 deprecate/purge 治理却仍被检索命中。每日 03:17 清理。
      # 数据迁移期间可临时关闭，避免误删由外部脚本补录但暂未归档的切片。
      cleanup-orphan-enabled: true

      # 保留期（R10 确认 2026-08-12）
      retention:
        # 废弃后保留多少天再归档。默认 90 天供审计窗口与撤销恢复。
        # 超期后由 KnowledgeRetentionScheduler 定时扫描，正文转对象存储。
        deprecated-days: 90
        # 归档后保留多少天再物理删除。默认 365 天。
        # 超期后由 KnowledgeRetentionScheduler 定时清理，级联删除历史/标签/切片。
        archived-days: 365

      # 保留期定时清理任务（R3-①）
      cleanup:
        # 总开关。关闭后全部定时清理任务跳过（日志级 debug）。
        enabled: true
        # 每次扫描最大处理数。限制单次事务工作量，避免大事务阻塞。
        batch-size: 500
        # 废弃→归档执行开关（P1 默认 false，仅统计不执行）。
        # 归档需 P2-4 MinIO 存储落地方可使用（正文转对象存储），
        # 且需先执行 migration_v10 补 archived_at/archive_path 列。
        # 开启前请确认上述前提已满足，否则事务会因缺少列而失败。
        archive-enabled: false

# 高风险操作审批 (P1-3 Single Writer)
    approval:
      # HIGH 优先级工单是否需人工审批后才写库
      # L1 阶段默认 false 保持现有体验；L3 引入审批工作流后置为 true
      high-priority-ticket: false

    # 健康检查开关（P1-7）
    health:
      # /api/v1/health/ai-model 探测会真实调用付费 LLM + embedding API，
      # 每次拉取都产生计费。默认关闭，仅运维手动验证连通性时临时开启。
      # /ping 与 /db 不调付费 API，始终开放，可被 K8s probe 高频拉取。
      ai-model-enabled: false

    # 上下文预算管理 (MVP-1)
    context-window: 32000

    # Token 预算（与 ContextBudgetManager 读取的 devops.ai.* 对齐）
    reserved-response-tokens: 1500
    system-prompt-tokens: 800

    # 三层记忆架构 (P1-1)
    memory:
      # 热记忆：滑动窗口保留轮数（一轮 = 提问 + 回答）
      hot-window-turns: 10
      # 热记忆 TTL（分钟），静默超时后由归档任务持久化到温记忆
      hot-ttl-minutes: 120

      # ---- 冷记忆归档（B-2）----
      # 归档总开关。默认关闭：归档会写对象存储并置 archived 标记，需运维显式启用。
      archive-enabled: ${MEMORY_ARCHIVE_ENABLED:false}
      # 保留天数：会话创建超过此天数且未归档者进入归档候选（按 create_time 判定，
      # 非 update_time——否则长期续聊的老会话永不归档）
      archive-after-days: 90
      # 单轮归档上限，防长事务与内存堆积；剩余量下一轮继续（日志如实告知积压）
      archive-batch-size: 200
      # 归档执行时刻（6 位 cron）。默认每日 04:23——错开 :00/:30 与其他定时任务
      # （孤儿切片 03:17、知识保留期 03:30/04:00），避免同时刻争抢数据库与对象存储连接。
      # 配置化而非硬编码：运维需按业务低峰调整，验证时需临时提频。
      archive-cron: ${MEMORY_ARCHIVE_CRON:0 23 4 * * *}

  # ==================== 告警接入（L2 实时监测） ====================
  alert:
    # 告警接收总开关。关闭后 AlertWebhookController 仍返回 200 但跳过处理。
    # 用于运维期临时禁入，不改变 Prometheus 重试行为（非 200 会重试）。
    enabled: true

    # ==================== Webhook 端点防护（A6）====================
    # /api/v1/alerts/webhook 在鉴权白名单内（Alertmanager 带不了 Sa-Token），
    # 却直接写库并可触发自动建单，因此必须单独加固。
    webhook:
      # 共享密钥。请求需带 X-Webhook-Token 头且与此值一致。
      # 留空 = 不校验（向后兼容既有 alertmanager.yml），仅打一次告警日志。
      # ⚠️ 生产环境必须通过 ALERT_WEBHOOK_SECRET 设置，否则任何人都能灌入伪造告警。
      # 配置后需同步在 monitoring/alertmanager.yml 的 webhook_configs 加：
      #   http_config:
      #     authorization: { type: Bearer, credentials: <secret> }
      #   —— 或用 Alertmanager 支持的自定义 header 方式传 X-Webhook-Token。
      secret: ${ALERT_WEBHOOK_SECRET:}
      # 单来源 IP 在窗口内允许的最大推送次数；<=0 关闭限流。
      # 300/分钟 是按「一次较大规模故障的告警量」留的余量：
      # 正常业务远低于此，而告警风暴（网络分区可产生上万条）会被挡住。
      rate-limit: ${ALERT_WEBHOOK_RATE_LIMIT:300}
      rate-window-ms: 60000
    # 自动建单开关。关闭后告警仍入库并去重，但不触发自动建单（Single Writer 契约 6.10）。
    # 适合告警风暴时保护工单系统，风暴过后可手动补单。
    auto-ticket-enabled: true
    # 自动建单创建人标识（对齐 AlertService.ALERT_CREATOR "alert-bot"）
    ticket-creator: alert-bot
    # 告警聚合降噪（方向 E）：窗口内同 service+module 的不同告警聚合到同一工单，
    # 避免一个故障源引发的多条告警各建一张工单刷屏。关闭则回退每条各建单。
    aggregate-enabled: true
    # 聚合时间窗口（分钟）
    aggregate-window-minutes: 5

  # ==================== L2 通知渠道（钉钉自定义机器人） ====================
  notify:
    dingtalk:
      # 通知总开关。默认关闭——需运维填 webhook 后显式开启（改为 true 或设环境变量）。
      # 关闭/未配 webhook 时 DingTalkNotifier 以 MOCK 方式仅打印日志，不阻塞主流程。
      enabled: ${DINGTALK_NOTIFY_ENABLED:false}
      # 钉钉群自定义机器人 Webhook URL。含敏感 access_token，只从环境变量读，不写入本文件。
      webhook: ${DINGTALK_WEBHOOK:}
      # 加签密钥（钉钉安全设置选「加签」时提供）。为空则不加签（用于「关键词」或「IP 白名单」模式）。
      secret: ${DINGTALK_SECRET:}

  # ==================== 工单闭环（B1 首响 SLA） ====================
  ticket:
    # 首响超时扫描开关。关闭后已超时的工单不再被标记——
    # 用于数据迁移/压测期间避免把大批历史工单一次性标成超时污染看板。
    # 读取方：FirstResponseBreachScheduler.scanEnabled
    response-breach-scan-enabled: true
    # 扫描间隔（毫秒）。默认 2 分钟：P0 首响时限仅 15 分钟，
    # 若按常规 5~10 分钟扫描，最坏情况超时后 10 分钟才发现，占时限 2/3，告警失去意义。
    # 读取方：FirstResponseBreachScheduler 的 @Scheduled(fixedDelayString)
    response-breach-scan-interval-ms: 120000

  # ==================== 对象存储（工单附件） ====================
  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:29000}
      access-key: ${MINIO_ACCESS_KEY:devops_minio}
      secret-key: ${MINIO_SECRET_KEY:devops_minio_pwd}
      bucket: ${MINIO_BUCKET:devops-ticket-attachment}
      # 冷记忆归档专用桶。与附件桶分离：两者保留期与访问模式不同，
      # 混用会让对象生命周期策略无法分别配置。桶由归档任务启动时兜底创建（private）
      archive-bucket: ${MINIO_ARCHIVE_BUCKET:devops-memory-archive}
      # 预签名 URL 有效期（秒）。短有效期降低链接泄露风险，
      # 又足够用户完成一次下载。
      presign-expiry-seconds: 300

    attachment:
      # 单文件上限（字节），20MB。运维日志/配置/截图足够。
      max-file-size: 20971520
      # 单工单附件数上限，防止无节制堆积
      max-count-per-ticket: 10
      # 扩展名白名单（小写，不含点）。
      # 用白名单而非黑名单：黑名单永远列不全可执行类型
      # （.exe .bat .sh .jsp .php .dll .so .jar .msi .vbs .ps1 …），
      # 漏一个即成上传后门。
      allowed-extensions: log,txt,json,yaml,yml,xml,csv,md,conf,ini,properties,png,jpg,jpeg,gif,webp,pdf,zip,gz,tar,tgz

